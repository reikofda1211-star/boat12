name: Trifecta Open API Compatible Research
'on':
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat12-trifecta-api-research
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'requests>=2.32,<3'
      - name: Safety checks
        run: |
          python trifecta_train.py --self-test
          python trifecta_api_train.py --self-test
      - name: Train and compare with matched baseline
        run: python -u trifecta_api_train.py
      - name: Save separate research result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f trifecta_api_model_report.json history/trifecta/api_model_research.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store Open API compatible trifecta research'
          git pull --rebase origin main
          git push origin HEAD:main
