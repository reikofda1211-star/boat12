<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOAT12｜日次分析カード</title>
<style>body{margin:0;padding:22px 14px 70px;background:#081827;color:#ecf8ff;font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto}h1{font-size:24px}p{color:#afc8d8}a{color:#60dceb}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}label{flex:1;min-width:160px}select,button{width:100%;font:inherit;color:#fff;background:#18354b;border:1px solid #42647d;padding:10px;border-radius:9px;min-height:45px}button{cursor:pointer}.controls button{flex:1;min-width:120px}img{display:block;width:100%;border-radius:12px;border:1px solid #42647d}.actions{display:flex;gap:10px;margin-top:12px}.actions>*{flex:1;text-align:center;border-radius:9px;padding:11px;border:1px solid #42647d}#download{background:#1ed4e6;color:#04233a;font-weight:700;text-decoration:none}small{color:#9bb5ca}</style></head><body><main>
<a href="accuracy.html">← 予測の検証ページ</a><h1>BOAT12 日次分析カード</h1><p>締切前の保存予測と結果確定レースから、Xで共有できる画像を作成します。結果待ちは分母に含めません。</p>
<div class="controls"><label>対象日<select id="day"></select></label><label>最低予測確率<select id="threshold"><option value="0.3">30%以上</option><option value="0.4" selected>40%以上</option><option value="0">全保存予測</option></select></label><button id="refresh">更新</button></div>
<p id="status" role="status">データを読み込んでいます…</p><img id="preview" alt="日次分析カード（読み込み中）"><div class="actions"><a id="download" download="boat12-report.png">画像を保存</a><button id="share">共有する</button></div><p><small>iPhoneでは画像を長押しして「写真に保存」もできます。数値は実験的な予測の検証結果で、利益や回収率ではありません。</small></p>
<script>
'use strict';const $=id=>document.getElementById(id);let records=[],updated='';const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=675;const c=canvas.getContext('2d');
function txt(t,x,y,size=28,color='#fff',weight=600,align='left'){c.textAlign=align;c.fillStyle=color;c.font=`${weight} ${size}px system-ui,-apple-system,sans-serif`;c.fillText(t,x,y)}
function paint(){const date=$('day').value,cut=Number($('threshold').value),items=records.filter(r=>r.date===date&&typeof r.probability==='number'&&r.probability>=cut),done=items.filter(r=>r.result_status==='confirmed'&&typeof r.hit==='boolean'),hits=done.filter(r=>r.hit).length,rate=done.length?(100*hits/done.length).toFixed(1)+'%':'—';
 const grad=c.createLinearGradient(0,0,1200,675);grad.addColorStop(0,'#061625');grad.addColorStop(1,'#103f5c');c.fillStyle=grad;c.fillRect(0,0,1200,675);c.strokeStyle='#175072';c.lineWidth=1;for(let x=0;x<1200;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,675);c.stroke()}for(let y=0;y<675;y+=60){c.beginPath();c.moveTo(0,y);c.lineTo(1200,y);c.stroke()}
 c.strokeStyle='#00daf2';c.lineWidth=6;c.beginPath();c.moveTo(50,75);c.bezierCurveTo(85,45,105,100,145,64);c.moveTo(50,99);c.bezierCurveTo(85,69,105,124,145,88);c.stroke();txt('BOAT',175,107,70,'#ffffff',900);txt('12',390,107,70,'#00e2f5',900);txt('DAILY REPORT',1145,75,25,'#80cede',700,'right');
 c.fillStyle='#25627c';c.fillRect(48,143,1104,2);txt(date.replaceAll('-',' / '),50,206,34,'#b8d8e8');txt(`1-2予測｜${Math.round(cut*100)}%以上の候補`,50,270,48,'#ffffff',800);
 c.fillStyle='#13344e';c.beginPath();c.roundRect(48,310,524,205,18);c.roundRect(592,310,560,205,18);c.fill();txt('1-2決着率',82,365,27,'#aecad9');txt(rate,82,475,95,'#58e4ef',800);txt('的中 / 結果確定',630,365,27,'#aecad9');txt(`${hits} / ${done.length}`,630,475,90,'#ffffff',800);
 txt(`対象 ${items.length}件　結果待ち ${items.length-done.length}件（分母から除外）`,52,565,27,'#c5d9e5');txt('締切前保存予測のみ / 1-2決着率は回収率ではありません',52,614,22,'#a2bdcc');txt('boat12.pages.dev',1150,647,27,'#54dbe8',800,'right');txt('実験的な推定値',52,647,20,'#a2bdcc');
 const url=canvas.toDataURL('image/png');$('preview').src=url;$('preview').alt=`${date} 候補${items.length}件、確定${done.length}件、1-2決着${hits}件、決着率${rate}`;$('download').href=url;$('download').download=`boat12-${date}-${Math.round(cut*100)}.png`;$('status').textContent=`${date}｜候補 ${items.length}件、結果確定 ${done.length}件、的中 ${hits}件。${!done.length?'確定済みの記録がありません。':''}`;}
async function load(){try{$('status').textContent='最新データ取得中…';$('refresh').disabled=true;const response=await fetch('accuracy_history.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(data.schema!=='boat12-accuracy-history-v2'||!Array.isArray(data.records))throw Error('集計データの形式が異なります');records=data.records;updated=data.generated_at;const days=[...new Set(records.map(r=>r.date).filter(Boolean))].sort().reverse(),previous=$('day').value;$('day').replaceChildren();for(const day of days){const opt=document.createElement('option');opt.value=day;opt.textContent=day;$('day').append(opt)}if(days.includes(previous))$('day').value=previous;if(!days.length)throw Error('予測記録がありません');paint()}catch(e){$('status').textContent='データの読み込みに失敗しました：'+e.message}finally{$('refresh').disabled=false}}
$('day').addEventListener('change',paint);$('threshold').addEventListener('change',paint);$('refresh').addEventListener('click',load);$('share').addEventListener('click',async()=>{try{const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('画像を作れませんでした');const file=new File([blob],$('download').download,{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'BOAT12分析カード'});else if(navigator.share)await navigator.share({title:'BOAT12分析カード',url:'https://boat12.pages.dev/social-card.html'});else $('status').textContent='画像を長押しして保存してください'}catch(e){if(e.name!=='AbortError')$('status').textContent='共有できないため、画像を長押しして保存してください'}});load();
</script></main></body></html>
