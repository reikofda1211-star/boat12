name: BOAT12 OpenAPI Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 0-13,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat12-openapi-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Monitor all 24 venues
        run: python openapi_monitor.py
      - name: Verify pre-cutoff data
        run: python openapi_bridge.py
      - name: Check model compatibility
        run: |
          python openapi_adapter.py --self-test
          python openapi_adapter.py
      - name: Check normal exhibition compatibility
        run: |
          python openapi_normal_adapter.py --self-test
          python openapi_normal_adapter.py
      - name: Cross-check weather data
        run: |
          python openapi_weather_crosscheck.py --self-test
          python openapi_weather_crosscheck.py
      - name: Diagnose data refresh
        run: python boat12_refresh_diagnostic.py
      - name: Save monitoring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f openapi-status.json openapi-first-seen.json openapi-precutoff.json openapi-adapter-audit.json openapi-normal-audit.json openapi-weather-audit.json history/conditions/refresh_diagnostic.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update nationwide OpenAPI monitoring"
          git pull --rebase origin main
          git push origin HEAD:main
