
name: Tokuyama Boat Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python main.py
