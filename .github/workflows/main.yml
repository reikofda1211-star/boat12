
name: Tokuyama Boat Analysis

on:
  workflow_dispatch:
  schedule:
  - cron: '0 0,8,16 * * *'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python main.py

      - name: Check training data
        if: always()
        run: python train.py

        
      - name: Save ranking page
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f index.html ]; then git add index.html; fi
          if [ -f history/races.csv ]; then git add history/races.csv; fi
          git diff --cached --quiet || git commit -m "Update ranking and history"
          git push

