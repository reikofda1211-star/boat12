name: BOAT12 Prospective Wind Comparison

'on':
  workflow_dispatch:
  schedule:
    # JST 07:45; historical result collection/training runs earlier.
    - cron: '45 22 * * *'

permissions:
  contents: write

concurrency:
  group: boat12-prospective-wind
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
      - name: Safety test
        run: python boat12_prospective_wind.py --self-test
      - name: Score unseen future races
        run: python boat12_prospective_wind.py
      - name: Save independent research only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f history/conditions/wind_prospective_frozen.joblib history/conditions/wind_prospective_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update frozen wind comparison"
          git pull --rebase origin main
          git push origin HEAD:main
