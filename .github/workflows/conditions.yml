# Replace .github/workflows/conditions.yml with this complete file.
# Refreshes run for at most 55 minutes and save about every 2 minutes.
# A yellow/running job is expected; data is saved DURING the run.
# Existing models, probability rules and other workflows are unchanged.
name: Conditions Update

'on':
  workflow_dispatch:
    inputs:
      history_days:
        description: '更新は0。過去データの追加学習は1〜90。日次学習は自動。'
        type: string
        default: '0'
        required: true
  schedule:
    # Wake-up triggers only. GitHub may delay them; the bounded session
    # keeps refreshing between triggers after it actually starts.
    - cron: '2,17,32,47 0-13,23 * * *'
    # JST 06:17: same daily historical collection/training as before.
    - cron: '17 21 * * *'

permissions:
  contents: write

concurrency:
  group: boat12-conditions
  cancel-in-progress: false

jobs:
  conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/conditions.yml
      - name: Install tested dependencies
        run: >-
          python -m pip install
          requests==2.32.5 pandas==2.2.3 numpy==2.3.5
          scikit-learn==1.8.0 joblib==1.5.3
      - name: Offline safety tests
        run: python conditions.py --self-test
      - name: Refresh and save repeatedly (up to 55 minutes)
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          HISTORY_DAYS: ${{ inputs.history_days }}
        shell: bash
        run: |
          python -u - <<'PYTHON'
          """Bounded refresh session. Run from the checked-out boat12 repository."""
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          from zoneinfo import ZoneInfo

          DURATION_SECONDS = 55 * 60
          INTERVAL_SECONDS = 120
          JST = ZoneInfo("Asia/Tokyo")


          def jst_now():
              return datetime.now(JST)


          def parse_days(raw):
              try:
                  value = Decimal(str(raw).strip() or "0")
              except InvalidOperation as exc:
                  raise ValueError("history_days must be 0, or a whole number from 1 to 90") from exc
              if not value.is_finite() or not 0 <= value <= 90 or value != value.to_integral_value():
                  raise ValueError("history_days must be a whole number between 0 and 90")
              return int(value)


          def checked(args, seconds=90):
              return subprocess.run(args, check=True, timeout=seconds)


          def save_conditions():
              paths = [p for p in ("conditions.json", "accuracy.json", "accuracy_history.json", "history/accuracy_results", "history/conditions") if Path(p).exists()]
              if not paths:
                  return False
              checked(["git", "add", "-f", "--", *paths, ":(exclude)**/*.tmp"])
              diff = subprocess.run(["git", "diff", "--cached", "--quiet"], timeout=30)
              if diff.returncode == 0:
                  return False
              if diff.returncode != 1:
                  raise RuntimeError("Could not inspect staged changes")
              checked(["git", "commit", "-m", "Update weather and exhibition research data"])
              # Rebase unrelated workflow changes. Never force-push or auto-resolve conflicts.
              for attempt in range(3):
                  checked(["git", "pull", "--rebase", "origin", "main"])
                  result = subprocess.run(["git", "push", "origin", "HEAD:main"], timeout=90)
                  if result.returncode == 0:
                      return True
                  if attempt < 2:
                      time.sleep(5)
              raise RuntimeError("Could not save conditions data; stopped without force push")


          def run_once(days=0):
              # Each iteration sees any newly committed model/code, without discarding edits.
              checked(["git", "pull", "--ff-only", "origin", "main"])
              command = [sys.executable, "-u", "conditions.py"]
              if days:
                  command += ["--history-days", str(days), "--train"]
              print("REFRESH START", jst_now().isoformat(), "history_days=", days, flush=True)
              # Do not retry denied sources in a tight loop. Any nonzero process stops this session.
              result = subprocess.run(command, timeout=1800 if days else 180)
              audit_result = subprocess.run([sys.executable, "-u", "latency_audit.py"], timeout=30)
              if audit_result.returncode:
                  raise RuntimeError("latency_audit.py failed; check its log")
              score_result = subprocess.run([sys.executable, "-u", "score_today.py"], timeout=90)
              if score_result.returncode:
                  raise RuntimeError("score_today.py failed; check its log")
              saved = save_conditions()
              if result.returncode:
                  raise RuntimeError("conditions.py failed; check its log. The session has stopped.")
              print("REFRESH SAVED" if saved else "REFRESH NO CHANGES", jst_now().isoformat(), flush=True)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as stream:
                      stream.write(f"- {jst_now():%Y-%m-%d %H:%M:%S} JST: refresh completed; saved={saved}\n")


          def main():
              event = os.environ.get("EVENT_NAME", "")
              schedule = os.environ.get("EVENT_SCHEDULE", "")
              days = parse_days(os.environ.get("HISTORY_DAYS", "0")) if event == "workflow_dispatch" else 0
              if event == "schedule" and schedule == "17 21 * * *":
                  days = 30
              checked(["git", "config", "user.name", "github-actions[bot]"])
              checked(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
              if days:
                  run_once(days)
                  return
              end = time.monotonic() + DURATION_SECONDS
              cycles = 0
              while True:
                  if cycles and not 8 <= jst_now().hour < 23:
                      break
                  started = time.monotonic()
                  run_once(0)
                  cycles += 1
                  # Outside the daytime window, a manual run performs one refresh only.
                  if not 8 <= jst_now().hour < 23:
                      break
                  delay = max(1, INTERVAL_SECONDS - (time.monotonic() - started))
                  if time.monotonic() + delay >= end:
                      break
                  time.sleep(delay)
              print("REFRESH SESSION FINISHED", "cycles=", cycles, flush=True)


          if __name__ == "__main__":
              main()
          PYTHON
