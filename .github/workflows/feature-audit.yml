
name: BOAT12 Feature Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3

      - name: Test analysis
        run: python boat12_feature_audit.py --self-test

      - name: Analyze model features
        run: python boat12_feature_audit.py

      - name: Save analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/conditions/normal_feature_audit.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Save normal model feature audit"
          git pull --rebase origin main
          git push origin HEAD:main
