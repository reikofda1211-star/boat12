name: BOAT12 Wind Ablation

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 joblib==1.5.3
      - name: Safety test
        run: python boat12_wind_ablation.py --self-test
      - name: Compare models
        run: python boat12_wind_ablation.py
      - name: Save experiment only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f history/conditions/wind_ablation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save read-only wind ablation experiment"
          git pull --rebase origin main
          git push origin HEAD:main
