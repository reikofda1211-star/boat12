name: Trifecta Live Model Research
'on':
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat12-trifecta-live-research
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'requests>=2.32,<3'
      - name: Verify probability calculations
        run: |
          python trifecta_train.py --self-test
          python trifecta_live_train.py --self-test
      - name: Compare models on matched chronological races
        run: python -u trifecta_live_train.py
      - name: Save research results without changing published predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f trifecta_live_model_report.json
          if [ -f history/trifecta/live_model_research.json ]; then
            git add -f history/trifecta/live_model_research.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record separate trifecta live model research'
          git pull --rebase origin main
          git push origin HEAD:main
