name: Trifecta Recent Data
'on':
  workflow_dispatch:
    inputs:
      history_days:
        description: '最近の日付から取り込む日数（初回30、最大60）'
        required: true
        type: string
        default: '30'
  schedule:
    - cron: '47 22 * * *'
permissions:
  contents: write
concurrency:
  group: boat12-trifecta-model
  cancel-in-progress: false
jobs:
  recent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'requests>=2.32,<3'
      - name: Safety tests
        run: python trifecta_train.py --self-test
      - name: Collect recent races and validate model
        env:
          DAYS: ${{ inputs.history_days || '30' }}
        run: |
          python - <<'PY'
          import os,subprocess,sys
          n=os.environ['DAYS']
          if not n.isdecimal() or not 0<=int(n)<=60:raise SystemExit('history_days must be 0..60')
          subprocess.run([sys.executable,'-u','trifecta_recent.py',n],check=True)
          PY
      - name: Commit only independent 3-ren-tan model and cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f trifecta_model.json history/trifecta/recent_training.json history/trifecta/labels/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update recent trifecta research data'
          git pull --rebase origin main
          git push origin HEAD:main
