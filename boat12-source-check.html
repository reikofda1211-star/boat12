<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOAT12 直前データ経路診断</title><style>:root{color-scheme:dark;font-family:system-ui;background:#0b1320;color:#f0f5fa}body{margin:0}main{max-width:800px;margin:auto;padding:22px 15px}h1{font-size:25px}p{line-height:1.7;color:#b5c5d7}label{display:block;font-size:13px;margin-bottom:4px}select,button{min-height:44px;background:#17283e;color:inherit;border:1px solid #456075;border-radius:9px;padding:9px;font:inherit}select{width:100%}button{cursor:pointer}section{border:1px solid #384e66;border-radius:14px;padding:15px;margin:16px 0}.fields{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}article{padding:12px;background:#122033;border-radius:10px;margin-top:12px}.sub{font-size:13px;color:#bed0e1}a{color:#a9ebdf}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}@media(max-width:550px){.fields{grid-template-columns:1fr 1fr}.fields button{grid-column:1/-1}}</style></head><body><main><h1>BOAT12｜直前データ経路診断</h1><p>現在のCSV配信と非公式Open APIについて、指定レースの展示・風データが取得できるかを比較します。結果は<strong>このブラウザ内だけで表示</strong>し、予測やGitHubの既存ファイルは変更しません。</p><section><div class="fields"><div><label for="venue">競艇場</label><select id="venue"></select></div><div><label for="race">レース</label><select id="race"></select></div><button id="check">データを比較</button></div><p id="update" class="sub">未実行</p></section><div id="out" aria-live="polite"></div><section><strong>結果の読み方</strong><p>「取得できた」は、その瞬間に公開データに含まれていた意味です。公式サイトでの掲載開始時刻は示しません。配信データの更新が遅い場合や、締切・展示情報が変更された場合は差が出ます。実運用前には利用条件を確認してください。</p></section><script>
'use strict';
const PLACES=['桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];
const $=x=>document.getElementById(x), esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&quot;',"'":'&#39;'}[x]));
const today=()=>new Date(Date.now()+32400000).toISOString().slice(0,10), valid=v=>v!==null&&v!==undefined&&v!=='';
function csvParse(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);field='';if(row.some(x=>x!==''))rows.push(row);row=[]}else field+=c}if(field||row.length){row.push(field);rows.push(row)}const keys=rows.shift()||[];return rows.map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]??''])))}
async function grab(url){const c=new AbortController(),tm=setTimeout(()=>c.abort(),13000);try{const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(tm)}}
function card(name,message,detail=''){return '<article><strong>'+esc(name)+'</strong><p>'+esc(message)+'</p>'+(detail?'<pre>'+esc(detail)+'</pre>':'')+'</article>'}
async function scan(){const code=String($('venue').value).padStart(2,'0'),race=Number($('race').value),day=today(),yyyymmdd=day.replaceAll('-',''),suffix=day.replaceAll('-','/'),id=yyyymmdd+code+String(race).padStart(2,'0');$('check').disabled=true;$('update').textContent='取得中… '+new Date().toLocaleString('ja-JP');const out=$('out');out.innerHTML='';try{const results=await Promise.allSettled([grab('https://boatracecsv.github.io/data/previews/tkz/'+suffix+'.csv'),grab('https://boatracecsv.github.io/data/previews/stt/'+suffix+'.csv'),grab('https://boatracecsv.github.io/data/previews/sui/'+suffix+'.csv'),grab('https://boatraceopenapi.github.io/api/v1/'+day.slice(0,4)+'/'+yyyymmdd+'.json')]);let html='<section><h2>'+esc(PLACES[Number(code)-1])+' '+race+'R</h2><p>確認時刻：'+esc(new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))+'（JST）</p>';for(let i=0;i<3;i++){const name=['CSV 展示タイム','CSV 展示ST','CSV 風・波'][i],rs=results[i];if(rs.status==='rejected'){html+=card(name,'取得不可（通信・CORS・提供元の問題）',String(rs.reason));continue}const match=csvParse(rs.value).find(r=>r['レースコード']===id);html+=card(name,match?'レース行あり':'この取得時点ではレース行なし',match?'取得日時：'+(match['取得日時']||'記載なし')+' ／ 締切時刻：'+(match['締切時刻']||'不明'):'')}
const last=results[3];if(last.status==='rejected'){html+=card('Boatrace Open API','取得不可（通信・CORS・提供元の問題）',String(last.reason))}else{try{const obj=JSON.parse(last.value),raceobj=obj?.programs?.stadiums?.[String(Number(code))]?.races?.[String(race)],preview=raceobj?.preview;if(!raceobj)html+=card('Boatrace Open API','指定レースが存在しない');else if(!preview)html+=card('Boatrace Open API','指定レースの直前情報は未掲載');else{const racers=preview.racers||{};const n=Object.values(racers).filter(x=>x&&valid(x.start_timing)).length;html+=card('Boatrace Open API','直前情報あり','風速：'+(preview.wind_speed??'未取得')+'m / 風向：'+(preview.wind_direction_number??'未取得')+' / 波：'+(preview.wave_height??'未取得')+'cm / STあり：'+n+'艇 / 締切：'+(raceobj.closed_at||'不明'));}}catch(e){html+=card('Boatrace Open API','JSONの解釈に失敗',String(e))}}html+='</section>';out.innerHTML=html;}finally{$('check').disabled=false;$('update').textContent='確認完了。締切10分前・8分前・6分前に同じレースで比較すると傾向が分かります。'}}
PLACES.forEach((v,i)=>$('venue').add(new Option(v,String(i+1))));for(let i=1;i<=12;i++)$('race').add(new Option(i+'R',String(i)));$('check').addEventListener('click',()=>scan().catch(e=>{$('out').innerHTML=card('診断エラー',e.message);$('check').disabled=false}));
</script></main></body></html>
