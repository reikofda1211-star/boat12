name: Trifecta Live Dataset
'on':
  workflow_dispatch:
  schedule:
    - cron: '52 22 * * *'
permissions:
  contents: write
concurrency:
  group: boat12-trifecta-live-dataset
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate timestamps and input logic
        run: |
          python trifecta_live_features.py
          python trifecta_live_dataset.py --self-test
      - name: Build audited dataset from already stored files
        run: python trifecta_live_dataset.py
      - name: Save dataset and audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f history/trifecta/live_dataset.json trifecta_live_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update predeadline trifecta live dataset audit'
          git pull --rebase origin main
          git push origin HEAD:main
